# Release : déclenchée par un tag de version (v*) poussé à la demande du mainteneur, ou
# manuellement (workflow_dispatch, release en BROUILLON uniquement si `draft_release` est coché).
# Produit le paquet Windows, le bundle CLI, les licences et SHA256SUMS.txt.
# Une préversion (3.0.0-alpha.N…) est publiée comme pre-release ; les notes viennent du CHANGELOG.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Créer une release GitHub en brouillon (jamais publiée automatiquement)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: dist:win
            optional: false
          # Linux : pas publié pour le moment. Pour le réactiver, ajouter
          # { os: ubuntu-latest, target: dist:linux, optional: true } (vérifié par le job package-linux de la CI).
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run licenses
      - run: npm run ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run build -w @monolith/cli
      - name: Rassembler les artefacts
        shell: bash
        run: |
          mkdir -p upload
          find release -maxdepth 1 -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.deb' \) -exec cp {} upload/ \;
          VERSION=$(node -p "require('./package.json').version")
          cp apps/cli/dist/monolith.mjs "upload/MonolithHarness-CLI-v${VERSION}-node24.mjs"
          cp THIRD-PARTY-LICENSES.txt LICENSE upload/
          node scripts/prepare-release.mjs upload
      - uses: actions/upload-artifact@v4
        with:
          name: monolith-${{ matrix.os }}
          path: upload/
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.draft_release }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "Le tag ${GITHUB_REF_NAME} ne correspond pas à la version ${VERSION} du package.json." >&2
            exit 1
          fi
          mkdir -p upload && find dist-all -type f ! -name SHA256SUMS.txt -exec cp {} upload/ \;
          test -n "$(find upload -name '*-win-x64.zip')" || { echo 'Paquet Windows absent.' >&2; exit 1; }
          node scripts/prepare-release.mjs upload
          # Notes : section de la version dans le CHANGELOG.
          awk -v v="## ${VERSION} " 'index($0, v) == 1 { on = 1; next } /^## / && on { exit } on { print }' CHANGELOG.md > notes.md
          printf '\n---\nWindows : archive portable (zip, données dans data/ à côté de Monolith.exe) ou installateur (exe). Empreintes : SHA256SUMS.txt.\n' >> notes.md
          FLAGS=""
          case "${VERSION}" in *-*) FLAGS="--prerelease" ;; esac
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then FLAGS="--draft"; fi
          gh release create "${TAG}" upload/* --title "Monolith Harness ${VERSION}" --notes-file notes.md ${FLAGS}
