# Distribution desktop. Aucune publication automatique : `publish: never`.
appId: com.monolithharness.desktop
productName: Monolith Harness
executableName: MonolithHarness
copyright: Copyright © 2026 Loïc DELAUNAY
directories:
  output: ../../artifacts/GUI
  buildResources: build
files:
  - out/**
  - build/icon.png
  - package.json
  - "!**/*.map"
extraResources:
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../THIRD-PARTY-LICENSES.txt
    to: THIRD-PARTY-LICENSES.txt
asar: true
publish: null
win:
  icon: build/icon.png
  target:
    - target: zip
      arch: [x64]
    - target: nsis
      arch: [x64]
  artifactName: MonolithHarness-v${version}-win-x64.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  category: Development
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: MonolithHarness-v${version}-linux-x64.${ext}
  maintainer: Loïc DELAUNAY
mac:
  # Architecture prévue, non construite ni testée.
  icon: build/icon.png
  category: public.app-category.developer-tools
